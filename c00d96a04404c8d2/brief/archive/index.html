:root {
  --bg: #f7f3eb;
  --bg-elev: #fffdf8;
  --ink: #1c1917;
  --muted: #5d574f;
  --rule: #d9d0c3;
  --accent: #8b3d2c;
  --navy: #1a2332;
  --gold: #9a7b4f;
  --worth-bg: #efe4cc;
  --worth-border: #d9c49a;
  --chip-bg: #efe8dc;
  --chip-active: #1a2332;
  --chip-active-ink: #f7f3eb;
  --shadow: 0 1px 2px rgba(28, 25, 23, 0.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141210;
    --bg-elev: #1d1a17;
    --ink: #f3efe6;
    --muted: #b7b0a6;
    --rule: #3a342c;
    --accent: #e0a090;
    --navy: #eadfcf;
    --gold: #c4a36a;
    --worth-bg: #2a2418;
    --worth-border: #4a3f2a;
    --chip-bg: #2a2622;
    --chip-active: #eadfcf;
    --chip-active-ink: #141210;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
.wrap {
  max-width: 40rem;
  margin: 0 auto;
  padding: 0 1.15rem 3.5rem;
}
.nav {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--rule);
  padding: max(0.45rem, env(safe-area-inset-top)) 0 0.5rem;
}
.nav-inner {
  max-width: 40rem;
  margin: 0 auto;
  padding: 0 1.15rem;
  display: flex;
  gap: 0.45rem;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.nav-inner::-webkit-scrollbar { display: none; }
.nav a {
  flex: 0 0 auto;
  display: inline-block;
  padding: 0.35rem 0.7rem;
  border-radius: 999px;
  background: var(--chip-bg);
  color: var(--ink);
  text-decoration: none;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  white-space: nowrap;
}
.nav a:hover { background: var(--chip-active); color: var(--chip-active-ink); }
.masthead {
  padding: 1.7rem 0 1.15rem;
  border-bottom: 1px solid var(--rule);
}
.kicker {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
  margin: 0 0 0.35rem;
}
.masthead h1 {
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Source Serif Pro", Georgia, serif;
  font-weight: 700;
  font-size: 2.25rem;
  line-height: 1.05;
  letter-spacing: -0.025em;
  margin: 0 0 0.45rem;
  color: var(--navy);
}
.date {
  margin: 0;
  color: var(--muted);
  font-size: 0.95rem;
  font-weight: 500;
}
.dek {
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-style: italic;
  font-size: 1.08rem;
  line-height: 1.45;
  margin: 1rem 0 0;
  color: var(--ink);
}
.dek strong { font-style: normal; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-weight: 650; }
h2 {
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Source Serif Pro", Georgia, serif;
  font-size: 1.28rem;
  letter-spacing: -0.015em;
  margin: 2rem 0 0.8rem;
  padding-bottom: 0.4rem;
  border-bottom: 2px solid var(--navy);
  color: var(--navy);
  scroll-margin-top: 4.2rem;
}
.weather-strip {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.65rem;
}
@media (min-width: 420px) {
  .weather-strip { grid-template-columns: 1fr 1fr; }
  .weather-strip .wx:last-child:nth-child(odd) { grid-column: 1 / -1; }
}
.wx {
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 0.75rem 0.85rem 0.7rem;
  box-shadow: var(--shadow);
}
.wx h3 {
  margin: 0 0 0.25rem;
  font-size: 0.82rem;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--navy);
}
.wx p { margin: 0; font-size: 0.92rem; color: var(--ink); }
.wx .src { margin-top: 0.35rem; font-size: 0.8rem; }
.worth {
  background: var(--worth-bg);
  border: 1px solid var(--worth-border);
  border-radius: 14px;
  padding: 0.25rem 1rem 0.85rem;
  margin: 0.4rem 0 0.2rem;
}
.worth h2 {
  border-bottom-color: var(--gold);
  margin-top: 1.1rem;
}
ol, ul { padding-left: 1.2rem; margin: 0.2rem 0 0; }
li { margin: 0.85rem 0; padding-left: 0.15rem; }
li::marker { color: var(--gold); }
.paywall { color: var(--muted); font-size: 0.88em; }
footer {
  margin-top: 2.8rem;
  padding-top: 1.2rem;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  font-size: 0.9rem;
}
footer p { margin: 0.45rem 0; }
.archive-list { list-style: none; padding: 0; margin: 1rem 0 0; }
.archive-list li {
  margin: 0;
  border-bottom: 1px solid var(--rule);
}
.archive-list a {
  display: block;
  padding: 0.85rem 0.1rem;
  text-decoration: none;
  color: var(--ink);
  font-family: "Iowan Old Style", Palatino, Georgia, serif;
  font-size: 1.15rem;
}
.archive-list a:hover { color: var(--accent); }
.hint { font-size: 0.8rem; color: var(--muted); }
@media print {
  .nav { display: none; }
  body { background: white; color: black; }
}
